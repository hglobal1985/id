name: Worker secrets

# Run by hand (Actions → Worker secrets → Run workflow). Puts secrets into the Worker without anyone seeing them:
# - OIDC_SIGNING_JWK: when "rotate_signing_key" is ticked, a new signing key is generated inside the runner and
#   piped straight into Cloudflare. Use it to create the first key; rotating later signs members out of apps.
# - WEBHOOK_SIGNING_KEY: when "create_webhook_key" is ticked, a random key is generated inside the runner and piped
#   straight into Cloudflare. Every App's webhook secret is derived from it: creating it again changes ALL of them.
# - GOOGLE_CLIENT_SECRET: copied from the GitHub environment secret of the same name, if set.
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
      rotate_signing_key:
        description: Generate a new OIDC signing key (signs everyone out of apps)
        type: boolean
        default: false
      create_webhook_key:
        description: Generate the webhook signing key (only the first time; doing it again changes every App's webhook secret)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    env:
      TARGET: ${{ inputs.environment }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Signing key
        if: inputs.rotate_signing_key
        run: node scripts/generate-signing-key.mjs | npx wrangler secret put OIDC_SIGNING_JWK --env "$TARGET"
      - name: Google client secret
        if: env.GOOGLE_CLIENT_SECRET != ''
        run: printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET --env "$TARGET"
      - name: Webhook signing key
        if: inputs.create_webhook_key
        run: node -e 'process.stdout.write(require("node:crypto").randomBytes(32).toString("base64url"))' | npx wrangler secret put WEBHOOK_SIGNING_KEY --env "$TARGET"
